<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <title>Connect | تواصل مع العالم</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Connect</h1>
        <p>تواصل مع العالم بسهولة وأمان</p>

    <main class="container">
        <div class="login-box">
            <h2>مرحباً بك 👋</h2>
            <p>ابدأ رحلتك مع Connect</p>

            <a class="facebook-btn"

               target="_blank"
               rel="noopener noreferrer">
                المتابعة باستخدام Facebook
            </a>

            <div class="separator"></div>

            <p class="privacy">
                سيتم تسجيل الدخول عبر موقع Facebook الرسمي.
            </p>
        </div>
    </main>

    <footer>
        Connect © 2026
    </footer>

</html>
